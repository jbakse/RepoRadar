[package]
name = "reporadar"
version = "0.1.0"
description = "RepoRadar - Git Repository Scanner & Health Monitor"
authors = ["RepoRadar"]
edition = "2021"

[lib]
name = "reporadar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
